<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml" lang="ru">
<head>
    <title>Rococo | Error</title>
    <link rel="icon" th:href="@{/images/favicon.ico}"/>
    <link th:href="@{/styles/styles.css}" rel="stylesheet" type="text/css"/>
</head>
<body data-testid="auth-error-body">
<main data-testid="auth-error-page">
    <div class="wrapper" data-testid="auth-error-wrapper">
        <section class="content" data-testid="auth-error-content">
            <div class="form" data-testid="auth-error">
                <h1 class="form__header" data-testid="auth-error-title">Ro<span class="form__text_gold" data-testid="auth-error-title-accent">coco</span></h1>
                <p class="form__error" data-testid="auth-error-status" th:text="|Error [[${status}]] [[${error}]]|">Unexpected error</p>
                <p class="form__paragraph" data-testid="auth-error-message" th:if="${message}" th:text="${message}">Something went wrong.</p>
                <p class="form__paragraph" data-testid="auth-error-path" th:if="${path}" th:text="|Path: [[${path}]]|">Path: /</p>
                <p class="form__paragraph" data-testid="auth-error-home-wrap">
                    <a class="form__link" data-testid="auth-error-home-link" th:href="@{|${frontUri}|}">Back to Rococo</a>
                </p>
            </div>
            <img class="content__image" src="../static/images/hermitage.jpg" th:src="@{/images/hermitage.jpg}"
                 alt="Эрмитаж" data-testid="auth-error-side-image"/>
        </section>
    </div>
</main>
</body>
</html>
