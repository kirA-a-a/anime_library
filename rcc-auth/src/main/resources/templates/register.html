<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml" lang="ru">
<head>
    <title>Регистрация в Rococo</title>
    <link rel="icon" th:href="@{/images/favicon.ico}"/>
    <link th:href="@{/styles/styles.css}" rel="stylesheet" type="text/css"/>
</head>
<body data-testid="register-body">
<main data-testid="register-page">
    <div class="wrapper" data-testid="register-wrapper">
        <section class="content" data-testid="register-content">
            <form th:if="${username == null}" class="form" id="register-form" th:object="${registrationForm}"
                  action="/register" th:action="@{/register}"
                  method="post" data-testid="register-form">
                <h1 class="form__header" data-testid="register-title">Ro<span class="form__text_gold" data-testid="register-title-accent">coco</span></h1>
                <label class="form__element" data-testid="register-username-field">
                    <span class="form__label" data-testid="register-username-label">Имя пользователя</span>
                    <span class="error__indicator error__username" data-testid="register-error-indicator-username"
                          th:if="${#fields.hasErrors('username')}"></span>
                    <input class="form__input" type="text" id="username" th:field="*{username}" name="username"
                           data-testid="register-username"
                           placeholder="Введите имя пользователя..." required/>
                    <span class="form__error error__username" data-testid="register-error-username"
                          th:if="${#fields.hasErrors('username')}"
                          th:errors="*{username}"></span>
                </label>
                <label class="form__element" data-testid="register-password-field">
                    <span class="form__label" data-testid="register-password-label">Пароль</span>
                    <span class="error__indicator error__password" data-testid="register-error-indicator-password"
                          th:if="${#fields.hasErrors('password')}"></span>
                    <input class="form__input" type="password" id="password" name="password" th:field="*{password}"
                           data-testid="register-password"
                           placeholder="Введите пароль..." required/>
                    <span class="form__error error__password" data-testid="register-error-password"
                          th:if="${#fields.hasErrors('password')}"
                          th:errors="*{password}"></span>
                </label>
                <label class="form__element" data-testid="register-password-submit-field">
                    <span class="form__label" data-testid="register-password-submit-label">Повторите пароль</span>
                    <span class="error__indicator error__passwordSubmit" data-testid="register-error-indicator-password-submit"
                          th:if="${#fields.hasErrors('passwordSubmit')}"></span>
                    <input class="form__input" type="password" id="passwordSubmit" name="passwordSubmit"
                           th:field="*{passwordSubmit}" data-testid="register-password-submit"
                           placeholder="Повторите пароль..." required/>
                    <span class="form__error error__passwordSubmit" data-testid="register-error-password-submit"
                          th:if="${#fields.hasErrors('passwordSubmit')}"
                          th:errors="*{passwordSubmit}"></span>
                </label>
                <button class="form__submit" type="submit" data-testid="register-submit">
                    Зарегистрироваться
                </button>
                <p class="form__paragraph" data-testid="register-login-hint">Уже есть аккаунт? <a th:href="@{|${frontUri}|}" class="form__link"
                                                               data-testid="register-login-link">Войти</a>
                </p>
            </form>
            <div class="form" th:unless="${username == null}" data-testid="register-success">
                <p class="form__subheader" data-testid="register-success-message">Добро пожаловать в Ro<span class="form__text_gold" data-testid="register-success-accent">coco</span></p>
                <p class="form__paragraph" data-testid="register-success-login-wrap"><a class="form__submit" th:href="@{|${frontUri}|}"
                                              data-testid="register-success-login-link">Войти в систему</a></p>
            </div>
            <img class="content__image" src="../static/images/renuar.jpeg" width="90" th:src="@{/images/renuar.jpeg}"
                 alt="Ренуар" data-testid="register-side-image"/>
        </section>
    </div>
</main>
<script>
    const usernameInput = document.querySelector("#username");
    const passwordInput = document.querySelector("#password");
    const passwordSubmitInput = document.querySelector("#passwordSubmit");

    usernameInput.addEventListener("input", () => {
       const error = document.querySelectorAll(".error__username");
       error.forEach(err => err.remove());
    });

    passwordInput.addEventListener("input", () => {
        const error = document.querySelectorAll(".error__password");
        error.forEach(err => err.remove());
    });

    passwordSubmitInput.addEventListener("input", () => {
        const error = document.querySelectorAll(".error__passwordSubmit");
        error.forEach(err => err.remove());
    });
</script>
</body>
</html>
